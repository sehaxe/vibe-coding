<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vibe-coding — promo stage</title>
<style>
  @font-face{font-family:"JetBrains Mono";src:url("../site/assets/fonts/JetBrainsMono-var.woff2") format("woff2");font-weight:400 700;font-display:swap}
  @font-face{font-family:"Instrument Serif";src:url("../site/assets/fonts/InstrumentSerif-normal.woff2") format("woff2");font-weight:400;display:swap}
  @font-face{font-family:"Instrument Serif";src:url("../site/assets/fonts/InstrumentSerif-italic.woff2") format("woff2");font-weight:400;font-style:italic;display:swap}
  *{box-sizing:border-box}
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#e9e2d6;font-family:-apple-system,"Inter",system-ui,sans-serif}
  .wall{position:absolute;inset:0;background:
    radial-gradient(900px 700px at 18% 20%, #f6d9c4 0%, rgba(246,217,196,0) 60%),
    radial-gradient(1000px 800px at 82% 30%, #cfd9ee 0%, rgba(207,217,238,0) 62%),
    radial-gradient(900px 700px at 55% 92%, #e7d3e8 0%, rgba(231,211,232,0) 60%),
    linear-gradient(160deg,#f7f1e7 0%,#e9e2d6 55%,#dcd6cd 100%)}
  .wall:after{content:"";position:absolute;inset:0;background:radial-gradient(1200px 700px at 50% 45%,rgba(255,255,255,.35),rgba(255,255,255,0) 70%)}
  .menubar{transition:opacity .45s ease;position:absolute;top:0;left:0;right:0;height:30px;display:flex;align-items:center;gap:22px;padding:0 18px;background:rgba(253,252,252,.62);backdrop-filter:blur(24px) saturate(160%);border-bottom:.5px solid rgba(0,0,0,.08);font-size:13px;color:#201d1d;z-index:30}
  .menubar .apple{font-size:15px;margin-right:2px}
  .menubar .b{font-weight:600}
  .menubar .right{margin-left:auto;display:flex;gap:18px;align-items:center;color:#424245;font-variant-numeric:tabular-nums}
  .win{position:absolute;left:220px;top:96px;width:1480px;height:880px;background:#fdfcfc;border-radius:12px;overflow:hidden;box-shadow:0 50px 140px rgba(30,20,10,.38),0 12px 40px rgba(30,20,10,.18),0 0 0 .5px rgba(0,0,0,.18);transform:scale(.94) translateY(18px);opacity:0;transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .6s ease}
  .win.in{transform:none;opacity:1}
  .bar{height:38px;display:flex;align-items:center;padding:0 14px;background:#f1eeee;border-bottom:.5px solid rgba(0,0,0,.1);position:relative}
  .lights{display:flex;gap:8px}
  .lights i{width:12px;height:12px;border-radius:50%;display:block}
  .lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
  .bar .title{position:absolute;left:0;right:0;text-align:center;font-size:12.5px;color:#646262;pointer-events:none}
  iframe{width:100%;height:calc(100% - 38px);border:0;display:block;background:#fdfcfc}
  .dock{transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .45s ease;position:absolute;left:50%;bottom:16px;transform:translateX(-50%) translateY(90px);display:flex;gap:10px;padding:9px 12px;border-radius:20px;background:rgba(253,252,252,.42);backdrop-filter:blur(28px) saturate(170%);border:.5px solid rgba(255,255,255,.55);box-shadow:0 18px 50px rgba(30,20,10,.22),inset 0 .5px 0 rgba(255,255,255,.6);transition:transform .8s cubic-bezier(.2,.8,.2,1);z-index:25}
  .dock.in{transform:translateX(-50%) translateY(0)}
  .app{width:48px;height:48px;border-radius:11px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.18),inset 0 .5px 0 rgba(255,255,255,.4);font-size:20px;color:#fff}
  .app svg{width:30px;height:30px;display:block}
  .a1{background:linear-gradient(180deg,#5fb3ff,#1e7ce8)}
  .a2{background:linear-gradient(180deg,#f7f7f7,#dcdcdc)}
  .a3{background:linear-gradient(180deg,#3a3a3c,#1c1c1e)}
  .a4{background:linear-gradient(180deg,#7b61ff,#4c2fd6)}
  .a5{background:linear-gradient(180deg,#ff8a65,#e64a19)}
  .a6{background:linear-gradient(180deg,#ff6b9a,#d81b60)}
  .a7{background:linear-gradient(180deg,#5ee7a0,#1aa863)}
  .a8{background:linear-gradient(180deg,#c9c9ce,#8e8e93)}
  body.zoom .menubar,body.zoom .dock{opacity:0}
  .cursor{position:absolute;left:0;top:0;width:24px;height:28px;z-index:60;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));opacity:0;transition:opacity .3s}
  .cursor.on{opacity:1}
  .ripple{position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid rgba(32,29,29,.5);z-index:59;pointer-events:none;transform:translate(-50%,-50%) scale(.2);opacity:0}
  .ripple.go{animation:rip .55s ease-out forwards}
  @keyframes rip{0%{opacity:.8;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(3.2)}}
  .end{position:absolute;inset:0;background:#201d1d;color:#fdfcfc;display:flex;flex-direction:column;justify-content:center;padding:0 160px;opacity:0;pointer-events:none;transition:opacity .7s ease;z-index:70}
  .end.on{opacity:1}
  .end img{width:300px;height:auto;display:block;margin-bottom:34px}
  .end h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:96px;line-height:.98;letter-spacing:-.02em;margin:0 0 22px}
  .end h1 em{font-style:italic}
  .end p{font-family:"JetBrains Mono",monospace;font-size:20px;color:#9a9898;margin:0 0 6px}
  .end .url{font-family:"JetBrains Mono",monospace;font-size:22px;color:#fdfcfc;margin-top:34px;border-bottom:1px solid rgba(253,252,252,.35);display:inline-block;padding-bottom:6px;width:max-content}
  .end .team{position:absolute;left:160px;bottom:70px;font-family:"JetBrains Mono",monospace;font-size:14px;color:#646262}
  #world{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
</style>
</head>
<body>
<div class="wall"></div>
<div class="menubar">
  <span class="apple"></span><span class="b">Finder</span><span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Window</span><span>Help</span>
  <span class="right"><span>◔</span><span>100%</span><span>Wed 28 Oct 14:32</span></span>
</div>

<div id="world">
  <div class="win" id="win">
    <div class="bar"><div class="lights"><i></i><i></i><i></i></div><div class="title">vibe-coding — cohort 04</div></div>
    <iframe id="frame" src="../site/index.html?rec=1"></iframe>
  </div>
</div>

<div class="dock" id="dock">
  <div class="app a1"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 4v8l6 4"/></svg></div>
  <div class="app a2"><svg viewBox="0 0 24 24" fill="none" stroke="#1d1d1f" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 12l5-5"/></svg></div>
  <div class="app a3"><svg viewBox="0 0 24 24" fill="none" stroke="#fdfcfc" stroke-width="1.8"><path d="M4 7l4 5-4 5"/><path d="M12 17h8"/></svg></div>
  <div class="app a4"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M8 5l-4 7 4 7"/><path d="M16 5l4 7-4 7"/></svg></div>
  <div class="app a5"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="9" cy="9" r="4"/><circle cx="15" cy="9" r="4"/><circle cx="9" cy="15" r="4"/><circle cx="15" cy="15" r="4"/></svg></div>
  <div class="app a6"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="16" r="2"/></svg></div>
  <div class="app a7"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M12 3v18M3 12h18M6 6l12 12M18 6L6 18"/></svg></div>
  <div class="app a8"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M5 7h14l-1 13H6L5 7z"/><path d="M9 7V5h6v2"/></svg></div>
</div>

<svg class="cursor" id="cursor" viewBox="0 0 24 28" xmlns="http://www.w3.org/2000/svg">
  <path d="M3 2l16 12-7 1.2L9.5 23 3 2z" fill="#0f0f0f" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
</svg>
<div class="ripple" id="ripple"></div>

<div class="end" id="end">
  <img src="../site/assets/brand/opencode-wordmark-dark.png" alt="OpenCode">
  <h1>Ship apps<br>by <em>vibes.</em></h1>
  <p>6 weeks · 36 hours · 19 lessons · reviewed capstone</p>
  <div class="url">vibe-coding.dev — cohort 04 starts Nov 10</div>
  <div class="team">Denis · Danik · Mukhammed · Arseniy</div>
</div>

<script>
const frame = document.getElementById('frame');
const cursor = document.getElementById('cursor');
const ripple = document.getElementById('ripple');
const world = document.getElementById('world');
const end = document.getElementById('end');
const dock = document.getElementById('dock');
const win = document.getElementById('win');
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const doc = () => frame.contentDocument;
const fwin = () => frame.contentWindow;

function setCursor(x, y) {
  cursor.style.transform = `translate(${x}px, ${y}px)`;
  cursor.style.left = '0'; cursor.style.top = '0';
}

function move(x, y, ms = 800) {
  return new Promise(res => {
    const c = getComputedStyle(cursor).transform;
    let sx = 0, sy = 0;
    if (c && c !== 'none') {
      const m = c.match(/matrix\(([^)]+)\)/);
      if (m) { const p = m[1].split(',').map(Number); sx = p[4]; sy = p[5]; }
    }
    const t0 = performance.now();
    function step(t) {
      const k = Math.min(1, (t - t0) / ms);
      const e = 1 - Math.pow(1 - k, 3);
      setCursor(sx + (x - sx) * e, sy + (y - sy) * e);
      if (k < 1) requestAnimationFrame(step); else res();
    }
    requestAnimationFrame(step);
  });
}

async function pos(sel) {
  const el = doc().querySelector(sel);
  if (!el) throw new Error('no element ' + sel);
  const r = el.getBoundingClientRect();
  const fr = frame.getBoundingClientRect();
  return { x: fr.left + r.left + r.width / 2, y: fr.top + r.top + r.height / 2 };
}

async function click() {
  ripple.style.left = (parseFloat(cursor.style.transform.match(/translate\(([-\d.]+)px/)[1]) + 6) + 'px';
  ripple.style.top = (parseFloat(cursor.style.transform.match(/,\s*([-\d.]+)px/)[1]) + 4) + 'px';
  ripple.classList.remove('go'); void ripple.offsetWidth; ripple.classList.add('go');
  await wait(140);
}

async function zoom(z, x, y, ms = 900) {
  world.style.transition = `transform ${ms}ms cubic-bezier(.2,.8,.2,1)`;
  world.style.transformOrigin = `${x}px ${y}px`;
  world.style.transform = `scale(${z})`;
  await wait(ms + 120);
}

async function scrollTo(sel, offset = 0) {
  const el = doc().querySelector(sel);
  fwin().scrollTo({ top: el.offsetTop + offset, behavior: 'instant' });
  await wait(500);
}

async function typeInto(sel, text) {
  const el = doc().querySelector(sel);
  el.focus();
  el.value = '';
  for (const ch of text) {
    el.value += ch;
    el.dispatchEvent(new Event('input', { bubbles: true }));
    await wait(38);
  }
}

function waitFrame() {
  return new Promise(res => {
    const done = () => setTimeout(res, 500);
    frame.addEventListener('load', done, { once: true });
    setTimeout(res, 8000);
  });
}

window.director = async function () {
  // clean state
  try { fwin().localStorage.removeItem('vibe.done'); fwin().localStorage.removeItem('vibe.name'); } catch (e) {}
  await wait(500);
  dock.classList.add('in');
  await wait(900);
  win.classList.add('in');
  await wait(1400);
  cursor.classList.add('on');
  setCursor(1500, 780);
  await wait(400);

  // 1. hero → start the course
  let p = await pos('.hero .btn-p');
  await move(p.x, p.y, 900); await wait(250); await click(); await wait(300);
  const nav1 = waitFrame();
  doc().querySelector('.hero .btn-p').click();
  await nav1;
  await wait(900);

  // 2. course: open lesson 1.1 (already default) — run the lab
  p = await pos('#run');
  await move(p.x, p.y, 800); await wait(200); await click(); await wait(200);
  doc().querySelector('#run').click();
  await wait(2600);

  // 3. answer the checkpoint
  p = await pos('.opt[data-i="1"]');
  await move(p.x, p.y, 700); await wait(200); await click(); await wait(150);
  doc().querySelector('.opt[data-i="1"]').click();
  await wait(400);
  p = await pos('#check');
  await move(p.x, p.y, 500); await wait(150); await click();
  doc().querySelector('#check').click();
  await wait(600);

  // 4. mark complete
  p = await pos('#complete');
  await move(p.x, p.y, 600); await wait(150); await click();
  doc().querySelector('#complete').click();
  await wait(1200);

  // 5. back to landing → demo
  const nav2 = waitFrame();
  frame.src = '../site/index.html?rec=1';
  await nav2;
  await wait(900);
  await scrollTo('#demo', -40);
  await wait(700);
  p = await pos('#prompt');
  await move(p.x, p.y, 700); await wait(150); await click(); await wait(200);
  await typeInto('#prompt', 'landing page for a coffee shop');
  await wait(300);
  p = await pos('#go');
  await move(p.x, p.y, 400); await wait(150); await click();
  doc().querySelector('#go').click();
  await wait(5200);

  // 6. zoom the preview
  p = await pos('#frame');
  document.body.classList.add('zoom');
  await zoom(1.55, p.x, p.y, 1000);
  await wait(2800);
  await zoom(1, p.x, p.y, 900);
  document.body.classList.remove('zoom');

  // 7. agents demo
  await scrollTo('#agents', -40); await wait(1400);
  p = await pos('#aw');
  document.body.classList.add('zoom');
  await zoom(1.22, p.x, p.y, 900);
  await wait(3200);
  await zoom(1, p.x, p.y, 800);
  document.body.classList.remove('zoom');

  // 8. team + price
  await scrollTo('#team', -30); await wait(2600);
  await scrollTo('#pricing', -60); await wait(800);
  p = await pos('.price .big');
  await zoom(1.28, p.x, p.y, 800);
  await wait(1800);
  await zoom(1, p.x, p.y, 700);

  // 9. end card
  await wait(500);
  end.classList.add('on');
  cursor.classList.remove('on');
  await wait(3600);
  window.__done = true;
};

if (new URLSearchParams(location.search).has('record')) {
  window.addEventListener('load', () => setTimeout(() => window.director(), 600));
}
</script>
</body>
</html>
