<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vibe-coding — film</title>
<style>
  @font-face{font-family:"JetBrains Mono";src:url("../../site/assets/fonts/JetBrainsMono-var.woff2") format("woff2");font-weight:400 700;font-display:block}
  @font-face{font-family:"Instrument Serif";src:url("../../site/assets/fonts/InstrumentSerif-normal.woff2") format("woff2");font-weight:400;font-display:block}
  @font-face{font-family:"Instrument Serif";src:url("../../site/assets/fonts/InstrumentSerif-italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:block}
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0d0b0b}
  canvas{display:block;width:1920px;height:1080px}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080, TAU = Math.PI * 2;
let __t = 0;
const c = document.getElementById('c');
const ctx = c.getContext('2d');

const C = { ink: '#0d0b0b', cream: '#fdfcfc', ember: '#ff5a36', blue: '#2f6bff', gray: '#9a9898', dim: '#646262' };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = (t) => 1 - Math.pow(1 - clamp(t), 3);
const easeInOut = (t) => { t = clamp(t); return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// deterministic grain
const grain = document.createElement('canvas');
grain.width = 480; grain.height = 270;
{
  const g = grain.getContext('2d');
  const img = g.createImageData(480, 270);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 120 + Math.floor(hash(i) * 135);
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
}

const wm = new Image(); wm.src = '../../site/assets/brand/opencode-wordmark-dark.png';
const qr = new Image(); qr.src = '../../site/assets/brand/qr.png';

function font(size, kind = 'serif', italic = false, weight = 400) {
  return `${italic ? 'italic ' : ''}${weight} ${size}px ${kind === 'serif' ? '"Instrument Serif"' : '"JetBrains Mono"'}`;
}

function T(s, x, y, size, o = {}) {
  const { kind = 'serif', italic = false, weight = 400, color = C.cream, alpha = 1, align = 'left', ls = 0, baseline = 'alphabetic' } = o;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.font = font(size, kind, italic, weight);
  ctx.textAlign = align;
  ctx.textBaseline = baseline;
  if ('letterSpacing' in ctx) ctx.letterSpacing = ls + 'px';
  ctx.fillText(s, x, y);
  ctx.restore();
}

function measure(s, size, kind = 'serif', italic = false, weight = 400, ls = 0) {
  ctx.save();
  ctx.font = font(size, kind, italic, weight);
  if ('letterSpacing' in ctx) ctx.letterSpacing = ls + 'px';
  const w = ctx.measureText(s).width;
  ctx.restore();
  return w;
}

function words(s, x, y, size, u, o = {}, stagger = 0.07) {
  const parts = s.split(' ');
  let cx = x;
  parts.forEach((w, i) => {
    const a = clamp((u - i * stagger) / 0.55);
    const dy = (1 - easeOut(a)) * 26;
    const ww = measure(w, size, o.kind, o.italic, o.weight, o.ls);
    T(w, cx, y + dy, size, { ...o, alpha: (o.alpha ?? 1) * a });
    cx += ww + measure(' ', size, o.kind, o.italic, o.weight, o.ls);
  });
}

function wordsSlow(s, x, y, size, t, start, stagger, dur, o = {}) {
  let cx = x;
  s.split(' ').forEach((w, i) => {
    const a = clamp((t - start - i * stagger) / dur);
    const ww = measure(w, size, o.kind, o.italic, o.weight, o.ls);
    T(w, cx, y + (1 - easeOut(a)) * 34, size, { ...o, alpha: (o.alpha ?? 1) * a });
    cx += ww + measure(' ', size, o.kind, o.italic, o.weight, o.ls);
  });
}

function bg(ink) {
  ctx.save();
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = ink ? C.ink : C.cream;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
  ambient(__t, ink);
}

function mesh(t, a, b) {
  const g1 = ctx.createRadialGradient(W * .2 + Math.sin(t * .2) * 80, H * .25, 0, W * .2, H * .25, 900);
  g1.addColorStop(0, a); g1.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g1; ctx.fillRect(0, 0, W, H);
  const g2 = ctx.createRadialGradient(W * .82, H * .3 + Math.cos(t * .17) * 60, 0, W * .82, H * .3, 1000);
  g2.addColorStop(0, b); g2.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
}

function grainOverlay(alpha = 0.055) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.globalCompositeOperation = 'overlay';
  ctx.drawImage(grain, 0, 0, W, H);
  ctx.restore();
}

function vignette(alpha = 0.5) {
  const a = alpha * 0.28;
  const g = ctx.createRadialGradient(W / 2, H / 2, H * .5, W / 2, H / 2, H * 1.05);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, `rgba(0,0,0,${a})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

const BEATS = [7.06,7.78,8.50,9.22,9.94,10.66,11.38,12.07,12.77,13.51,14.21,14.93,15.65,16.35,17.07,17.79,18.51,19.20,19.92,20.62,21.34,22.04,22.76,23.48,24.17,24.89,25.61,26.31,27.03,27.72,28.44,29.21,29.91,30.63,31.35,32.07,32.74,33.48,34.20,34.92,35.64,36.34,37.06,37.78,38.48,39.20,39.94,40.63,41.31,42.03,42.77,43.47,44.19,44.91,45.63,46.32,47.04,47.76,48.48,49.20,49.92,50.64,51.29,52.04,52.76,53.45,54.17,54.87,55.59,56.31,57.03,57.72,58.44,59.16,59.88,60.58,61.32,62.04,62.74,63.44,64.16,64.90,65.60,66.32,67.04,67.76,68.45,69.17,69.87,70.59,71.31,72.03,72.75,73.47,74.16,74.88,75.63,76.30,77.02,77.72,78.44,79.18,79.90,80.60,81.32,82.01,82.71,83.41,84.17,84.87,85.59,86.29,87.01,87.72,88.47,89.14,89.88,90.60,91.32,92.02,92.72,93.46,94.16,94.88,95.60,96.29,97.01,97.73,98.45,99.15,99.89,100.59,101.31,102.01,102.75];
function pulse(t) {
  let m = 0;
  for (let i = 0; i < BEATS.length; i++) {
    const d = t - BEATS[i];
    if (d > -0.09 && d < 0.09) m = Math.max(m, Math.exp(-Math.pow(d / 0.06, 2)));
  }
  return m;
}

function ring(x, y, r, color, alpha = 1, lw = 1) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke(); ctx.restore();
}

function dot(x, y, r, color, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.restore();
}

function line(x1, y1, x2, y2, color, alpha = 1, lw = 1) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
}

function cursor(x, y, s = 1, color = C.cream) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = color; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(16, 12); ctx.lineTo(7, 13.2); ctx.lineTo(9.5, 23); ctx.closePath();
  ctx.fill(); ctx.stroke(); ctx.restore();
}

// ---------- scenes ----------
function s0(t) { // 0 - 10.66 : long fade-in
  bg(true);
  const reveal = easeInOut(clamp(t / 7));
  ctx.save(); ctx.globalAlpha = reveal * .9;
  mesh(t, 'rgba(255,90,54,.10)', 'rgba(47,107,255,.08)');
  ctx.restore();

  const cx = 1470, cy = 470, r = 250;
  const oa = clamp((t - 1.5) / 5);
  ctx.save(); ctx.globalAlpha = oa;
  ring(cx, cy, r, C.cream, .10, 1);
  ring(cx, cy, r * .72, C.cream, .06, 1);
  for (let i = 0; i < 18; i++) {
    const a = (i / 18) * TAU + t * .12;
    const rr = i % 3 === 0 ? r : r * .72;
    dot(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, i % 3 === 0 ? 2 : 1, C.cream, .22);
  }
  const ca = t * .35;
  cursor(cx + Math.cos(ca) * r - 6, cy + Math.sin(ca) * r - 10, .9, C.cream);
  for (let i = 0; i < 7; i++) {
    const ph = (t * .12 + i * .137) % 1;
    const a = hash(i * 9.1) * TAU;
    const rr = 120 + hash(i * 3.7) * 260;
    dot(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, 1.6, C.ember, .5 * (1 - ph));
  }
  ctx.restore();

  const lw = easeOut(clamp((t - 1.5) / 5));
  line(140, 780, 140 + 720 * lw, 780, C.cream, .22, 1);
  dot(140 + 720 * lw, 780, 3, C.blue, lw);

  T('vibe-coding · cohort 04', 140, 330, 14, { kind: 'mono', color: C.gray, alpha: clamp((t - 3.2) / 2.4), ls: 3 });
  wordsSlow("You didn't sign up", 140, 480, 96, t, 4.4, .3, 2.4, { color: C.cream });
  T('to', 140, 586, 96, { color: C.cream, alpha: clamp((t - 5.8) / 2) });
  T('babysit', 140 + measure('to ', 96), 586, 96, { italic: true, color: C.ember, alpha: clamp((t - 6.2) / 2) });
  T('an agent.', 140 + measure('to babysit ', 96) + 18, 586, 96, { color: C.cream, alpha: clamp((t - 6.6) / 2) });
  T('You signed up to build.', 140, 680, 18, { kind: 'mono', color: C.gray, alpha: clamp((t - 8.2) / 1.6) });

  const p = pulse(t);
  if (p > .01) {
    ring(cx, cy, r + 20 + (1 - p) * 90, C.blue, p * .18, 1.5);
    ring(cx, cy, r + 40 + (1 - p) * 140, C.cream, p * .08, 1);
  }
  grainOverlay(.05); vignette(.5);
}

function s1(t) { // 5.5 - 8.2 : ship
  bg(true);
  mesh(t, 'rgba(47,107,255,.10)', 'rgba(255,90,54,.07)');
  const u = t - 10.66;
  line(140, 760, 1780, 760, C.cream, .12, 1);
  const rise = easeOut(clamp(u / 2.2));
  const sy = lerp(860, 610, rise);
  const sg = ctx.createRadialGradient(1400, sy, 0, 1400, sy, 260);
  sg.addColorStop(0, 'rgba(253,252,252,.95)');
  sg.addColorStop(.45, 'rgba(253,252,252,.22)');
  sg.addColorStop(1, 'rgba(253,252,252,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(1400, sy, 260, 0, TAU); ctx.fill();
  dot(1400, sy, 110 + pulse(t) * 6, C.cream, .96);
  dot(1400, sy, 110, C.blue, .10);
  // trail
  for (let i = 1; i < 8; i++) dot(1400, sy + i * 26, 2, C.cream, .10 * (1 - i / 8));
  words('You wanted to ship.', 140, 540, 108, u - .1, { color: C.cream });
  T('so we built the loop that makes it safe.', 140, 640, 18, { kind: 'mono', color: C.gray, alpha: clamp((u - .9) / .8) });
  grainOverlay(); vignette(.5);
}

function s2(t) { // 8.2 - 13 : wordmark
  bg(false);
  mesh(t, 'rgba(255,90,54,.05)', 'rgba(47,107,255,.06)');
  const u = t - 16.35;
  const cx = W / 2, cy = 500;
  // orbit
  for (let i = 0; i < 3; i++) {
    ring(cx, cy, 210 + i * 70, C.ink, .10 - i * .02, 1);
    const a = u * (.25 + i * .1) + i * 2;
    dot(cx + Math.cos(a) * (210 + i * 70), cy + Math.sin(a) * (210 + i * 70), 3, i === 1 ? C.blue : C.ink, .8);
  }
  const a = clamp((u - .2) / .7);
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.strokeRect(cx - 300, cy - 18, 24, 24); ctx.fillStyle = C.ink; ctx.fillRect(cx - 292, cy - 10, 8, 8); ctx.restore();
  T('vibe-coding', cx - 245, cy + 20, 96, { kind: 'mono', weight: 700, color: C.ink, alpha: a, ls: -2 });
  T('a six-week course in shipping with agents', cx, cy + 110, 18, { kind: 'mono', color: C.dim, align: 'center', alpha: clamp((u - .8) / .7) });
  T('spec  →  build  →  review  →  ship', cx, cy + 160, 16, { kind: 'mono', color: C.ink, align: 'center', alpha: clamp((u - 1.2) / .7), ls: 2 });
  // dots grid
  for (let i = 0; i < 40; i++) {
    const x = 140 + hash(i * 2.1) * 1640, y = 120 + hash(i * 7.7) * 840;
    dot(x, y, 1, C.ink, .10);
  }
  grainOverlay(.045); vignette(.06);
}

function s3(t) { // 13 - 26.6 : the loop of fixes
  bg(true);
  mesh(t, 'rgba(255,90,54,.10)', 'rgba(47,107,255,.04)');
  const u = t - 22.76;
  const cx = W / 2, cy = 500;
  const zoom = 1 + easeInOut(clamp((u - 1.6) / 2.6)) * .38;
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(zoom, zoom); ctx.translate(-cx, -cy);
  // ring of diff cards
  const N = 26, R = 330;
  for (let i = 0; i < N; i++) {
    const a = (i / N) * TAU + u * .18;
    const x = cx + Math.cos(a) * R, y = cy + Math.sin(a) * R;
    ctx.save(); ctx.translate(x, y); ctx.rotate(a + Math.PI / 2);
    ctx.globalAlpha = .55;
    ctx.fillStyle = 'rgba(253,252,252,.05)'; ctx.strokeStyle = 'rgba(253,252,252,.18)'; ctx.lineWidth = 1;
    ctx.fillRect(-34, -22, 68, 44); ctx.strokeRect(-34, -22, 68, 44);
    ctx.fillStyle = C.ember; ctx.globalAlpha = .5 + .4 * hash(i * 4.3);
    ctx.fillRect(-26, -10 + hash(i) * 6, 40 * hash(i * 2.2) + 8, 2);
    ctx.fillStyle = 'rgba(253,252,252,.35)';
    ctx.fillRect(-26, 2, 30, 1.5); ctx.fillRect(-26, 8, 44, 1.5);
    ctx.restore();
  }
  // orbit cursor
  const ca = u * .5;
  cursor(cx + Math.cos(ca) * R - 6, cy + Math.sin(ca) * R - 10, 1, C.cream);
  // center
  const ps = 1 + pulse(t) * .05;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(ps, ps);
  T('fix.', 0, 10, 150, { color: C.cream, align: 'center', italic: true });
  ctx.restore();
  T('fix.  fix.  fix.', cx, cy + 110, 24, { kind: 'mono', color: C.ember, align: 'center', alpha: .75, ls: 6 });
  ctx.restore();
  // caption
  const cap = clamp((u - 2) / 1);
  T('the model answers.', 140, 860, 18, { kind: 'mono', color: C.gray, alpha: cap });
  T('the agent acts.', 140, 890, 18, { kind: 'mono', color: C.cream, alpha: clamp((u - 3) / 1) });
  // glitch flashes near the end
  if (u > 2.3) {
    for (let i = 0; i < 3; i++) {
      const on = hash(Math.floor(u * 12) + i * 5) > .72;
      if (on) { ctx.fillStyle = C.ember; ctx.globalAlpha = .08; ctx.fillRect(0, hash(u + i) * H, W, 2 + hash(u * 2 + i) * 8); ctx.globalAlpha = 1; }
    }
  }
  grainOverlay(.07); vignette(.55);
}

function s4(t) { // 26.6 - 29.6 : build-up
  bg(true);
  const u = t - 27.03;
  const cx = W / 2, cy = H / 2;
  const p = clamp(u / 3);
  for (let i = 0; i < 5; i++) {
    const ph = (u * .6 + i * .2) % 1;
    ring(cx, cy, 40 + ph * 460, C.cream, (1 - ph) * .25, 1);
  }
  dot(cx, cy, 6 + 10 * (1 - p), C.cream, 1);
  const lines = ['6 weeks.', '36 hours.', 'One shipped feature.'];
  lines.forEach((l, i) => {
    const a = clamp((u - i * .75) / .35);
    if (a > 0) T(l, 140, 470 + i * 110, 78, { color: i === 2 ? C.blue : C.cream, alpha: a });
  });
  // flash at the drop
  if (u > 2.85) { ctx.fillStyle = C.cream; ctx.globalAlpha = clamp((u - 2.85) / .1); ctx.fillRect(0, 0, W, H); }
  grainOverlay(.05); vignette(.5);
}

function s5(t) { // 29.6 - 40.8 : the loop (drop)
  bg(false);
  mesh(t, 'rgba(47,107,255,.07)', 'rgba(255,90,54,.05)');
  const u = t - 29.91;
  const cx = 960, cy = 500;
  const labels = ['spec', 'build', 'review', 'ship'];
  const ang = -Math.PI / 2 + u * .18;
  const R = 250 + pulse(t) * 8;
  // diamond connectors
  const pts = labels.map((_, i) => {
    const a = ang + i * TAU / 4;
    return [cx + Math.cos(a) * R, cy + Math.sin(a) * R];
  });
  ctx.save(); ctx.strokeStyle = C.ink; ctx.globalAlpha = .18; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < 4; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.stroke(); ctx.restore();
  // nodes
  pts.forEach(([x, y], i) => {
    const a = clamp((u - i * .12) / .5);
    const s = 1 + pulse(t) * .06;
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    dot(0, 0, 7, C.blue, a);
    ring(0, 0, 46, C.ink, .22 * a, 1);
    T(labels[i], 0, 78, 40, { color: C.ink, align: 'center', alpha: a });
    ctx.restore();
  });
  T('the loop you will practise', cx, cy + 380, 16, { kind: 'mono', color: C.dim, align: 'center', alpha: clamp((u - .8) / .8), ls: 3 });
  T('vibe-coding', 140, 140, 22, { kind: 'mono', weight: 700, color: C.ink, alpha: .8 });
  T('a six-week course in shipping with agents', 140, 172, 13, { kind: 'mono', color: C.dim, alpha: .8 });
  // moving pulse dot around the diamond
  const k = (u * .35) % 1; const seg = Math.floor(k * 4); const lt = k * 4 - seg;
  const A = pts[seg], B = pts[(seg + 1) % 4];
  dot(lerp(A[0], B[0], lt), lerp(A[1], B[1], lt), 3, C.ember, .9);
  grainOverlay(.045); vignette(.06);
}

function s6(t) { // 40.8 - 51.4 : the course system
  bg(false);
  const u = t - 40.63;
  const cx = 1320, cy = 540;
  // 19 cards stack
  for (let i = 0; i < 19; i++) {
    const a = clamp((u - i * .035) / .4);
    const off = i * 9;
    ctx.save();
    ctx.globalAlpha = .9 * a;
    ctx.translate(cx + off * .6, cy - off * .8);
    ctx.rotate(-0.16);
    ctx.fillStyle = C.cream; ctx.strokeStyle = 'rgba(32,29,29,.16)'; ctx.lineWidth = 1;
    ctx.fillRect(-220, -140, 440, 280);
    ctx.strokeRect(-220, -140, 440, 280);
    ctx.fillStyle = 'rgba(32,29,29,.10)';
    ctx.fillRect(-190, -110, 180, 8);
    ctx.fillRect(-190, -90, 120, 5);
    ctx.fillStyle = C.blue; ctx.globalAlpha = .5 * a;
    ctx.fillRect(-190, 90, 40 + hash(i) * 60, 4);
    ctx.restore();
  }
  // module bars
  for (let i = 0; i < 6; i++) {
    const a = clamp((u - .2 - i * .1) / .5);
    const w = 40 + hash(i * 3.1) * 90;
    ctx.fillStyle = C.ink; ctx.globalAlpha = .18 * a;
    ctx.fillRect(140, 720 + i * 26, w * a, 8);
  }
  T('the course', 140, 240, 14, { kind: 'mono', color: C.dim, ls: 3 });
  words('19 lessons.', 140, 360, 78, u - .2, { color: C.ink });
  words('6 modules.', 140, 450, 78, u - .45, { color: C.ink });
  words('One capstone.', 140, 540, 78, u - .7, { color: C.ink });
  T('labs in the terminal · checkpoints · a certificate that prints', 140, 630, 15, { kind: 'mono', color: C.dim, alpha: clamp((u - 1.1) / .7) });
  grainOverlay(.04); vignette(.05);
}

function s7(t) { // 51.4 - 60 : the tools
  bg(true);
  mesh(t, 'rgba(47,107,255,.10)', 'rgba(255,90,54,.05)');
  const u = t - 51.29;
  const y = 520;
  // terminal node
  ctx.save(); ctx.globalAlpha = clamp((u - .1) / .6);
  ctx.fillStyle = 'rgba(253,252,252,.04)'; ctx.strokeStyle = 'rgba(253,252,252,.22)';
  ctx.lineWidth = 1; ctx.fillRect(180, y - 170, 560, 340); ctx.strokeRect(180, y - 170, 560, 340);
  T('opencode', 210, y - 120, 26, { kind: 'mono', weight: 700, color: C.cream });
  T('$ opencode', 210, y - 70, 16, { kind: 'mono', color: C.gray });
  T('› plan the change', 210, y - 38, 16, { kind: 'mono', color: C.cream });
  T('● Read  index.html', 210, y + 2, 14, { kind: 'mono', color: C.gray });
  T('● Edit  +128 −2', 210, y + 30, 14, { kind: 'mono', color: C.gray });
  T('✔ ready', 210, y + 62, 14, { kind: 'mono', color: '#7ee787' });
  ctx.restore();
  // browser node
  ctx.save(); ctx.globalAlpha = clamp((u - .5) / .6);

const SCENES = [
  [0, 10.66, s0, 1], [10.66, 16.35, s1, 1], [16.35, 22.76, s2, 0], [22.76, 27.03, s3, 1], [27.03, 29.91, s4, 1],
  [29.91, 40.63, s5, 0], [40.63, 51.29, s6, 0], [51.29, 60.58, s7, 1], [60.58, 70.59, s8, 0],
  [70.59, 77.02, s9, 1], [77.02, 81.32, s10, 0], [81.32, 87.01, s11, 1], [87.01, 95.60, s12, 0], [95.60, 108.54, s13, 1]
];

function ambient(t, dark) {
  const col = dark ? C.cream : C.ink;
  const fade = clamp((__t - 1) / 7);
  ctx.save();
  // scrolling grid
  ctx.globalAlpha = .028 * fade; ctx.strokeStyle = col; ctx.lineWidth = 1;
  const off = (t * 9) % 90;
  for (let x = -90 + off; x < W; x += 90) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = -90 + off; y < H; y += 90) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  // dust
  for (let i = 0; i < 80; i++) {
    const sp = 4 + hash(i * 2.3) * 18;
    const x = (hash(i * 3.1) * W + t * sp) % W;
    const y = (hash(i * 7.7) * H + Math.sin(t * .25 + i) * 26 + H) % H;
    ctx.globalAlpha = (.03 + hash(i * 1.7) * .06) * fade;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x, y, .7 + hash(i) * 1.6, 0, TAU); ctx.fill();
  }
  // speed lines
  for (let i = 0; i < 9; i++) {
    const y = hash(i * 4.4) * H;
    const x = ((t * (40 + hash(i) * 90) + hash(i * 2) * W) % (W + 500)) - 250;
    ctx.globalAlpha = (.05 + hash(i) * .04) * fade;
    ctx.fillStyle = col;
    ctx.fillRect(x, y, 70 + hash(i) * 140, 1);
  }
  // flying cursors
  for (let i = 0; i < 8; i++) {
    const sp = 22 + hash(i * 3.3) * 46;
    const x = ((hash(i * 5.1) * W + t * sp) % (W + 260)) - 130;
    const y = hash(i * 8.3) * H + Math.sin(t * .4 + i) * 46;
    ctx.globalAlpha = (.10 + hash(i * 2.2) * .12) * fade;
    cursor(x, y, .5 + hash(i * 6.1) * .45, col);
  }
  // drifting symbols
  for (let i = 0; i < 7; i++) {
    const x = ((hash(i * 9.2) * W + t * (6 + hash(i) * 12)) % (W + 80)) - 40;
    const y = (hash(i * 4.9) * H + t * (3 + hash(i) * 5)) % H;
    T(i % 2 ? '+' : '·', x, y, 16 + hash(i) * 18, { kind: 'mono', color: col, alpha: .07 + hash(i) * .06 });
  }
  // slow orbit
  ctx.globalAlpha = .05; ctx.strokeStyle = col; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(W * .5, H * .5, 430 + Math.sin(t * .2) * 55, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.arc(W * .5, H * .5, 300 + Math.cos(t * .16) * 40, 0.4, 0.4 + Math.PI * 1.2); ctx.stroke();
  ctx.restore();
}

function render(t) {
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, W, H);
  const sc = SCENES.find(([a, b]) => t >= a && t < b) || SCENES[SCENES.length - 1];
  __t = t;
  const u = t - sc[0];
  const punch = 1 + 0.028 * Math.exp(-u * 7);
  const dx = Math.sin(t * .13) * 9, dy = Math.cos(t * .11) * 7;
  ctx.save();
  ctx.translate(W / 2 + dx, H / 2 + dy); ctx.scale(punch, punch); ctx.translate(-W / 2, -H / 2);
  sc[2](t);
  ctx.restore();
}

window.seek = (t) => { render(t); };
window.__ready = false;
Promise.all([
  document.fonts.load('400 96px "Instrument Serif"'),

  new Promise(r => { if (wm.complete) r(); else wm.onload = r; }),
  new Promise(r => { if (qr.complete) r(); else qr.onload = r; })
]).then(() => { window.__ready = true; render(0); });
